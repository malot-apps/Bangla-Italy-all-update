<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Italian Tricolore Accent Ribbon on Top -->
  <g transform="translate(156, 75)">
    <rect x="0" y="0" width="66" height="14" rx="7" fill="#009246" />
    <rect x="67" y="0" width="66" height="14" rx="7" fill="#ffffff" />
    <rect x="134" y="0" width="66" height="14" rx="7" fill="#ce2b37" />
  </g>

  <!-- Center Emblem: Stylized Italian Boot & Bangladeshi Red Sun + Star -->
  <g transform="translate(256, 250)">
    <!-- Red Sun Circle of Bangladesh -->
    <circle cx="0" cy="0" r="100" fill="#dc2626" opacity="0.95" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fbbf24" stroke-width="6" />

    <!-- Italian Map / Star Icon -->
    <path d="M0 -60 L18 -18 L60 0 L18 18 L0 60 L-18 18 L-60 0 L-18 -18 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="14" fill="#059669" />
  </g>

  <!-- Bilingual Label -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">ইতালিপ্রবাসী</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#fbbf24" text-anchor="middle" letter-spacing="3">BANGLA-ITALY PORTAL</text>
</svg>
